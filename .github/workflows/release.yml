# Publishes the Inno Setup installer when a version tag is pushed (made by release.py).
# Tag v1.2.0 = normal release (users are told about it). Tag v1.2.0-rc1 = test release (users are not told).
name: Release TAAS

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # needed to create the release

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the tag matches the app version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $match = Select-String -Path taas\__init__.py -Pattern '__version__ = "(.+?)"'
          $version = $match.Matches[0].Groups[1].Value
          if ($tag -ne $version) {
            Write-Error "The tag is $tag but taas/__init__.py says $version. Use release.py to make releases."
            exit 1
          }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install libraries
        run: pip install -r requirements.txt pyinstaller

      - name: Run the tests
        run: python -m unittest discover -s tests -t .

      - name: Build TAAS.exe for installer
        run: pyinstaller --noconfirm --clean TAAS.spec

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
        shell: pwsh

      - name: Make the release folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist\TAAS.exe release\
          Copy-Item USER_GUIDE.md release\
          New-Item -ItemType Directory -Force installer_output | Out-Null

      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler not found at $iscc"
          }
          & $iscc "/DMyAppVersion=$env:APP_VERSION" "taas_setup.iss"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $flags = @()
          if ("${{ github.ref_name }}" -match "-") { $flags += "--prerelease" }
          $installer = "installer_output\TAAS_Setup_$env:APP_VERSION.exe"
          if (-not (Test-Path $installer)) {
            throw "Expected installer was not created: $installer"
          }
          gh release create "${{ github.ref_name }}" release\USER_GUIDE.md $installer --title "TAAS ${{ github.ref_name }}" --generate-notes @flags
